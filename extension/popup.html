<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishGuard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="logo">🛡️</div>
    <h1>PhishGuard</h1>
    <p class="subtitle">Website Security Scanner</p>

    <div class="url-box" id="urlBox">
        Loading URL...
    </div>

    <button id="scanBtn">Scan Website</button>

    <div id="loader" class="loader hidden"></div>

    <div id="resultCard" class="result hidden">
        <h2 id="verdict">Analyzing...</h2>
        <p id="confidence"></p>
        <p id="reason"></p>
    </div>
</div>

<script src="popup.js"></script>
</body>
</html>
